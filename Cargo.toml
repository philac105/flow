[package]
name = "runflow"
version = "0.1.0"
edition = "2021"
description = "Track work from idea to shipped code, in files that outlive the session"
license = "MIT"
repository = "https://github.com/philac105/flow"
readme = "README.md"
keywords = ["cli", "workflow", "agents", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "flow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# The build script parses each shipped preset to read its description and to
# check its declared name against its filename. Already a dependency (ADR-0005:
# the dependency count stays where it is).
[build-dependencies]
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
