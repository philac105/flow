<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #16181d; --muted: #6b7280;
    --line: #e3e6ea; --done: #1f9d55; --now: #b7791f; --drift: #c0392b;
    --pending: #c3c8d0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1b1e23; --ink: #e8eaed; --muted: #9aa2ad;
      --line: #2b3038; --done: #4ade80; --now: #fbbf24; --drift: #f87171;
      --pending: #464c56;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1.5rem; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { max-width: 1180px; margin: 0 auto 2rem; }
  h1 { font-size: 1.35rem; margin: 0 0 .3rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .85rem; }
  .grid {
    max-width: 1180px; margin: 0 auto; display: grid; gap: 1rem;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 1.1rem 1.2rem 1.2rem;
  }
  .kind {
    font: 600 .68rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  }
  .title { font-weight: 600; margin: .45rem 0 .1rem; font-size: 1.02rem; }
  .slug {
    font: .75rem ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
  }
  ol.stages { list-style: none; margin: 1rem 0 0; padding: 0; }
  ol.stages li {
    display: flex; align-items: baseline; gap: .55rem; padding: .17rem 0;
    font-size: .87rem; color: var(--muted);
  }
  ol.stages li .dot {
    width: .5rem; height: .5rem; border-radius: 50%; flex: none;
    background: var(--pending);
  }
  li.done .dot { background: var(--done); }
  li.done { color: var(--ink); }
  li.skipped .dot { background: var(--pending); }
  li.skipped span.name { text-decoration: line-through; }
  li.current .dot { background: var(--now); box-shadow: 0 0 0 3px color-mix(in srgb, var(--now) 25%, transparent); }
  li.current { color: var(--ink); font-weight: 600; }
  .drift {
    margin-top: .9rem; padding: .55rem .7rem; border-radius: 6px;
    border: 1px solid color-mix(in srgb, var(--drift) 40%, transparent);
    color: var(--drift); font-size: .8rem;
  }
  .handoff {
    margin-top: .9rem; padding-top: .8rem; border-top: 1px solid var(--line);
    font-size: .85rem; color: var(--muted); white-space: pre-wrap;
  }
  .empty { max-width: 1180px; margin: 0 auto; color: var(--muted); }
  footer {
    max-width: 1180px; margin: 2.5rem auto 0; color: var(--muted);
    font-size: .78rem; border-top: 1px solid var(--line); padding-top: 1rem;
  }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <div class="sub">__SUBTITLE__</div>
</header>
__BODY__
<footer>Generated by <code>flow board</code> at __GENERATED__ · state lives in <code>.flow/</code></footer>
</body>
</html>
